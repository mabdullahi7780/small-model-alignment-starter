# Task 3: supervised fine-tuning of Qwen/Qwen2.5-0.5B (guide configuration from the manual, section 9.2).
model: Qwen/Qwen2.5-0.5B
seed: 42
max_length: 512
train_examples: 30000
val_examples: 1000

per_device_batch_size: 2
grad_accum_steps: 16          # effective batch 2 x 16 = 32
epochs: 1

optimizer: adamw
lr: 2.0e-5
betas: [0.9, 0.999]
weight_decay: 0.1             # not applied to biases and norm weights
warmup_ratio: 0.03
schedule: cosine              # linear warmup, then cosine decay to 0
grad_clip: 1.0

precision: fp16_autocast      # fp32 master weights, fp16 autocast, dynamic loss scaling
gradient_checkpointing: false

eval_every: 100               # optimizer steps
eval_batch_size: 8
log_every: 10
